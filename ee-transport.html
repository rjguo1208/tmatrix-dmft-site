const $=i=>document.getElementById(i);
async function unlock(pw,quiet){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(SALT),iterations:ITER,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
  let plain;
  try{ plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(IV)},key,b(CT)); }
  catch(e){ if(!quiet) $("msg").textContent="Wrong code.";
            try{sessionStorage.removeItem(KEY);}catch(_){} return false; }
  const page=JSON.parse(new TextDecoder().decode(plain));
  document.title=page.title;
  $("gate").remove();
  $("content").outerHTML=page.body;
  try{sessionStorage.setItem(KEY,pw);}catch(_){}
  if(location.hash){ const t=document.getElementById(decodeURIComponent(location.hash.slice(1))); if(t) t.scrollIntoView(); }
  return true;
}
async function attempt(){
  const pw=$("pw").value; if(!pw) return;
  $("go").disabled=true; $("go").textContent="Deriving key\u2026"; $("msg").textContent="";
  await new Promise(r=>setTimeout(r,20));
  if(!await unlock(pw,false)){ $("go").disabled=false; $("go").textContent="Unlock"; $("pw").value=""; $("pw").focus(); }
}
$("go").addEventListener("click",attempt);
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")attempt();});
